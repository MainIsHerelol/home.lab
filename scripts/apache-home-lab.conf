<VirtualHost *:80>
    ServerName home.lab
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3080/
    ProxyPassReverse / http://127.0.0.1:3080/
    <Location /admin>
        Require ip 192.168.11.0/24
    </Location>
</VirtualHost>

