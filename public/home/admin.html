<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Lab Admin</title><link rel="stylesheet" href="/shared.css"></head><body><header><a class="brand" href="/">Home Lab Admin</a><span class="tag">Trusted home network only</span></header><main><h1>Publish an announcement</h1><form class="panel" id="form"><label>Title<input name="title" required maxlength="160"></label><label>Message<textarea name="body" required></textarea></label><div class="row"><label>Category<input name="category" placeholder="Household"></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="important">Important</option></select></label></div><label>Image URL (optional)<input type="url" name="image_url"></label><label>Link URL (optional)<input type="url" name="link_url"></label><div class="row"><label>Publish at<input type="datetime-local" name="publish_at"></label><label>Expires at<input type="datetime-local" name="expires_at"></label></div><label><input type="checkbox" name="pinned"> Pin this post</label><button>Publish</button><span id="result"></span></form><h2>Current announcements</h2><section id="posts"></section><h2>Dashboard configuration</h2><p class="muted">The editable source of truth is <code>data/config.json</code>. Saving below replaces it with valid JSON.</p><textarea id="config"></textarea><p><button id="save">Save configuration</button></p></main><script>
const f=document.querySelector('#form'),out=document.querySelector('#result'),posts=document.querySelector('#posts');async function load(){const [p,c]=await Promise.all([fetch('/api/announcements').then(r=>r.json()),fetch('/api/config').then(r=>r.json())]);posts.innerHTML=p.map(x=>`<article class="panel announcement"><b>${x.title}</b><p>${x.body}</p><button onclick="del('${x.id}')">Delete</button></article>`).join('');document.querySelector('#config').value=JSON.stringify(c,null,2)}async function del(id){await fetch('/api/announcements/'+id,{method:'DELETE'});load()}f.onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(f));data.pinned=f.pinned.checked;for(const x of ['publish_at','expires_at'])if(data[x])data[x]=new Date(data[x]).toISOString();let r=await fetch('/api/announcements',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});out.textContent=r.ok?'Published.':(await r.json()).error; if(r.ok){f.reset();load()}};document.querySelector('#save').onclick=async()=>{try{const r=await fetch('/api/config',{method:'PUT',headers:{'content-type':'application/json'},body:document.querySelector('#config').value});alert(r.ok?'Saved.':'Could not save.')}catch{alert('Invalid JSON.')}};load();
</script></body></html>
