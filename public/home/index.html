<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Lab · Home</title><link rel="stylesheet" href="/shared.css"></head><body><main class="shell"><nav class="nav"><a class="brand" href="/"><span class="brand-mark">⌂</span>Home Lab</a><div class="nav-links"><a href="http://tools.home.lab">Tools</a><a href="http://status.home.lab">Status</a><a href="/admin">Admin</a></div></nav><header class="hero"><div class="eyebrow">Household dashboard</div><h1>Everything home,<br>right where it belongs.</h1><p>A simple place for your family’s services, updates, and useful shortcuts.</p></header><section id="attention"></section><section class="section"><div class="section-header"><div><div class="eyebrow">Updates</div><h2>Household board</h2></div></div><div id="announcements" class="announcements"><div class="panel empty">No announcements today.</div></div></section><section class="section"><div class="section-header"><div><div class="eyebrow">Quick access</div><h2>Home services</h2></div><p>Configured for your home network</p></div><div id="cards" class="grid"></div></section></main><script>
const e=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function refresh(){const [c,p,s]=await Promise.all(['/api/config','/api/announcements','/api/status'].map(x=>fetch(x).then(r=>r.json())));cards.innerHTML=c.cards.filter(x=>x.enabled).map(x=>`<a class="card service-card" href="${e(x.url||'#')}"><div class="service-icon">${e(x.icon)}</div><h3>${e(x.title)}</h3><p>${e(x.description)}</p></a>`).join('');announcements.innerHTML=p.length?p.map(x=>`<article class="panel notice ${x.priority}"><div class="tag">${e(x.category||'HOME')}</div><h3>${e(x.title)}</h3><p>${e(x.body)}</p>${x.image_url?`<img src="${e(x.image_url)}" alt="">`:''}${x.link_url?`<p><a href="${e(x.link_url)}">Open link →</a></p>`:''}</article>`).join(''):'<div class="panel empty">No announcements today.</div>';let bad=s.services.filter(x=>!x.online);attention.innerHTML=bad.length?`<div class="panel notice important"><div class="eyebrow">Needs attention</div><h3>${bad.map(x=>e(x.name)).join(' · ')} is unavailable</h3><p>Open <a href="http://status.home.lab">System Status</a> for details.</p></div>`:''}refresh();setInterval(refresh,30000)
</script></body></html>
