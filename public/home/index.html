<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Lab</title><link rel="stylesheet" href="/shared.css"></head><body><header><a class="brand" href="/">Home Lab</a><span class="tag">Your household dashboard</span><button onclick="document.body.classList.toggle('light')">◐ Theme</button></header><main><h1>Welcome home.</h1><p class="muted">Useful household services in one calm place.</p><section id="alerts"></section><h2>Announcements</h2><section id="announcements"></section><h2>Home services</h2><section id="cards" class="grid"></section></main><script>
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const [config,posts,status]=await Promise.all(['/api/config','/api/announcements','/api/status'].map(x=>fetch(x).then(r=>r.json())));document.querySelector('#cards').innerHTML=config.cards.filter(x=>x.enabled).map(c=>`<a class="card" href="${esc(c.url||'#')}"><div class="icon">${esc(c.icon)}</div><h3>${esc(c.title)}</h3><p class="muted">${esc(c.description)}</p></a>`).join('');document.querySelector('#announcements').innerHTML=posts.length?posts.map(p=>`<article class="panel announcement ${p.priority}"><b>${esc(p.title)}</b>${p.category?` · <span class="tag">${esc(p.category)}</span>`:''}<p>${esc(p.body)}</p>${p.image_url?`<img src="${esc(p.image_url)}" style="max-width:100%;border-radius:10px">`:''}${p.link_url?`<p><a href="${esc(p.link_url)}">Open link →</a></p>`:''}</article>`).join(''):'<p class="muted">No announcements right now.</p>';const down=status.services.filter(s=>!s.online);document.querySelector('#alerts').innerHTML=down.length?`<section class="panel announcement important"><b>Needs attention</b><p>${down.map(x=>esc(x.name)).join(', ')} is unavailable.</p></section>`:''}load();setInterval(load,30000);
</script></body></html>
