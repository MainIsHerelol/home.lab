<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Lab · Status</title><link rel="stylesheet" href="/shared.css"></head><body><main class="shell"><nav class="nav"><a class="brand" href="http://home.lab"><span class="brand-mark">⌂</span>Home Lab</a><div class="nav-links"><a href="http://home.lab">Home</a><a href="http://tools.home.lab">Tools</a><span class="chip">Live status</span></div></nav><header class="hero"><div class="eyebrow">Server health</div><h1>Your home, in good hands.</h1><p>Live host metrics and checks for every service you bring online.</p></header><section id="metrics" class="grid"></section><section class="section"><div class="section-header"><div><div class="eyebrow">Last 24 hours</div><h2>CPU & memory activity</h2></div><p>Refreshes every 5 seconds</p></div><article class="panel tool"><canvas id="chart" class="chart" width="1100" height="280"></canvas></article></section><section class="section"><div class="section-header"><div><div class="eyebrow">Service checks</div><h2>What’s running</h2></div></div><div id="services" class="grid"></div></section></main><script>
function draw(points){const c=document.querySelector('#chart'),g=c.getContext('2d'),w=c.width,h=c.height;g.clearRect(0,0,w,h);g.strokeStyle='#ffffff14';g.lineWidth=1;for(let y=0;y<=4;y++){g.beginPath();g.moveTo(0,y*h/4);g.lineTo(w,y*h/4);g.stroke()}for(const [key,color] of [['cpu','#77d8ff'],['memory','#63e6b4']]){g.strokeStyle=color;g.lineWidth=3;g.beginPath();points.forEach((p,i)=>{let x=points.length<2?0:i*w/(points.length-1),y=h-h*p[key]/100;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}}
function uptime(n){let h=Math.floor(n/3600),d=Math.floor(h/24);return d?`${d}d ${h%24}h`:`${h}h`};async function refresh(){let d=await fetch('/api/status').then(r=>r.json()),m=d.metrics;metrics.innerHTML=[['CPU',m.cpu+'%'],['Memory',m.memory+'%'],['Uptime',uptime(m.uptime)],['Temperature',m.temperature===null?'Not available':m.temperature+'°C'],['Load average',m.load],['Host',m.hostname]].map(x=>`<article class="panel metric"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></article>`).join('');services.innerHTML=d.services.map(x=>`<article class="panel metric"><div><span class="status-dot ${x.online?'':'down'}"></span> <b>${x.name}</b></div><p class="tag">${x.online?`ONLINE${x.code?' · HTTP '+x.code:''}`:'NEEDS ATTENTION'}</p></article>`).join('');draw(m.history)}refresh();setInterval(refresh,5000)
</script></body></html>
