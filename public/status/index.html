<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Lab Status</title><link rel="stylesheet" href="/shared.css"></head><body><header><a class="brand" href="http://home.lab">Home Lab Status</a><span class="tag">Live system health</span></header><main><h1>Everything at a glance</h1><section id="stats" class="grid"></section><h2>24-hour activity</h2><section class="panel"><canvas id="chart" width="1000" height="220"></canvas><p class="tag">CPU usage (blue) · memory usage (green)</p></section><h2>Services</h2><section id="services" class="grid"></section><p class="tag">Updates every five seconds. Temperature appears when exposed by the server.</p></main><script>
function draw(points){const c=document.querySelector('#chart'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);for(const [key,color] of [['cpu','#69d5ff'],['memory','#51dd9a']]){x.strokeStyle=color;x.lineWidth=3;x.beginPath();points.forEach((p,i)=>{let px=i*Math.max(1,w/(points.length-1)),py=h-(p[key]/100*h);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}}async function load(){const d=await fetch('/api/status').then(r=>r.json()),m=d.metrics;document.querySelector('#stats').innerHTML=[['CPU',m.cpu+'%'],['Memory',m.memory+'%'],['Uptime',Math.floor(m.uptime/3600)+'h'],['Temperature',m.temperature===null?'Unavailable':m.temperature+'°C'],['Host',m.hostname],['OS',m.platform]].map(x=>`<section class="panel"><div class="tag">${x[0]}</div><div class="stat">${x[1]}</div></section>`).join('');document.querySelector('#services').innerHTML=d.services.map(s=>`<section class="panel"><span class="${s.online?'ok':'down'}">●</span> <b>${s.name}</b><p class="muted">${s.online?'Online'+(s.code?' · HTTP '+s.code:''):'Needs attention'}</p></section>`).join('');draw(m.history)}load();setInterval(load,5000);
</script></body></html>
